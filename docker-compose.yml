services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skuld-api-dev
    ports:
      - "${API_HOST_PORT:-8002}:8000"
    env_file:
      - .env
    volumes:
      - .:/app  # Hot-reload: o código da sua máquina reflete no container
      - skuld_cache_data:/app/temp/cache_maquina_tempo # Volume persistente do Histórico
      - skuld_models:/app/app/ml/models                # Volume persistente dos Modelos
    command: ["uvicorn", "app.api.routes:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  skuld_cache_data:
  skuld_models: